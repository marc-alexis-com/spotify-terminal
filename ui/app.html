<template rust:component="Jukebox">
  <main on:keydown="state.shortcut(&event)" on:resize="state.attach(&event)">
    <If condition="{{ state.screen.get() != Screen::Library }}">
      <Welcome jukebox="{{ state.clone() }}"></Welcome>
    </If>
    <If condition="{{ state.screen.get() == Screen::Library }}">
      <If condition="{{ state.player_on_top() }}">
        <PlayerBar jukebox="{{ state.clone() }}"></PlayerBar>
      </If>
      <div class="body" class:hidden="{{ state.help.get() || state.picker_shown() || state.lyrics_shown() || state.devices_shown() || state.renaming_shown() }}">
        <Shelves jukebox="{{ state.clone() }}"></Shelves>
        <TrackList jukebox="{{ state.clone() }}"></TrackList>
      </div>
      <If condition="{{ state.help.get() }}">
        <Help jukebox="{{ state.clone() }}"></Help>
      </If>
      <If condition="{{ state.picker_shown() }}">
        <PlaylistPicker jukebox="{{ state.clone() }}"></PlaylistPicker>
      </If>
      <If condition="{{ state.lyrics_shown() }}">
        <LyricsView jukebox="{{ state.clone() }}"></LyricsView>
      </If>
      <If condition="{{ state.devices_shown() }}">
        <DeviceList jukebox="{{ state.clone() }}"></DeviceList>
      </If>
      <If condition="{{ state.renaming_shown() }}">
        <RenamePlaylist jukebox="{{ state.clone() }}"></RenamePlaylist>
      </If>
      <If condition="{{ !state.player_on_top() }}">
        <PlayerBar jukebox="{{ state.clone() }}"></PlayerBar>
      </If>
      <p class="notice" class:error="{{ state.notice_is_error() }}">{{ state.notice_text() }}</p>
    </If>
  </main>
</template>
